name: Build & Analyze

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet requis pour la pertinence de l'analyse Sonar

      # Java 21 : requis pour exécuter le scanner Sonar lui-même (le plugin org.sonarqube 7.x
      # refuse Java 17). Le bytecode produit reste Java 11, imposé par le toolchain Gradle du
      # projet (java.toolchain.languageVersion dans build.gradle.kts) indépendamment du JDK qui
      # fait tourner Gradle.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build sonar --info

      - name: Artifacts (CLI + GUI jars) for release
        uses: actions/upload-artifact@v4
        with:
          name: javadsk-jars
          path: |
            build/libs/*.jar
            gui/build/libs/*.jar

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download jars artifact from build for release
        uses: actions/download-artifact@v4
        with:
          name: javadsk-jars
          path: artifacts

      - name: Verify build.gradle.kts version matches tag
        run: |
          GRADLE_VERSION=$(grep -Po '^version\s*=\s*"\K[^"]+' build.gradle.kts)
          if [[ "$GRADLE_VERSION" != "${GITHUB_REF_NAME}"* ]]; then
            echo "Error: build.gradle.kts version ($GRADLE_VERSION) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Extract changelog for release
        id: changelog
        run: |
          TAG=${GITHUB_REF_NAME}
          # Ancré en début de ligne (^## ) : sinon "### Ajouté" matche aussi /## / (sous-chaîne),
          # ce qui coupe l'extraction dès la première sous-section du changelog.
          CHANGELOG=$(awk "/^## ${TAG}/{flag=1; next}/^## /{flag=0}flag" CHANGELOG.md)
          if [ -z "$CHANGELOG" ]; then
            echo "Warning: No changelog entry found for ${TAG}"
            CHANGELOG="No changelog entry found for ${TAG}"
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Find CLI and GUI jars
        id: find_jars
        run: |
          # Nommés explicitement d'après le tag (pas un "head -n 1" sur un glob) : évite de publier
          # un jar d'une autre version si l'un ou l'autre build/libs en contient plusieurs.
          TAG=${GITHUB_REF_NAME}
          CLI_JAR="artifacts/build/libs/javadsk-${TAG}.jar"
          GUI_JAR="artifacts/gui/build/libs/gui-${TAG}.jar"
          if [ ! -f "$CLI_JAR" ] || [ ! -f "$GUI_JAR" ]; then
            echo "Error: expected both CLI and GUI jars for tag ${TAG}, got CLI='$CLI_JAR' (exists: $(test -f "$CLI_JAR" && echo yes || echo no)) GUI='$GUI_JAR' (exists: $(test -f "$GUI_JAR" && echo yes || echo no))"
            exit 1
          fi
          echo "cli_jar=$CLI_JAR" >> $GITHUB_OUTPUT
          echo "gui_jar=$GUI_JAR" >> $GITHUB_OUTPUT

      - name: Create Release and upload jars
        # softprops/action-gh-release@v3.0.2 , see https://github.com/softprops/action-gh-release/releases/tag/v3.0.2
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ env.CHANGELOG }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.find_jars.outputs.cli_jar }}
            ${{ steps.find_jars.outputs.gui_jar }}
