# Coloration syntaxique Geany pour Locomotive BASIC (Amstrad CPC).
# Réutilise le lexer "basic" de Scintilla (celui du filetype freebasic intégré à Geany).
#
# Installation : copier ce fichier dans
#   Linux/macOS : ~/.config/geany/filedefs/filetypes.cpcbasic.conf
#   Windows     : %APPDATA%\geany\filedefs\filetypes.cpcbasic.conf
#
# Note : associer *.bas à cpcbasic dans filetype_extensions.conf ne suffit pas, le
# FreeBasic intégré à Geany garde la main sur cette extension. Utiliser plutôt
# Document > Définir le type de fichier > CPCBasic.

[styling]
default=default
comment=comment_line
commentblock=comment
docline=comment_line_doc
docblock=comment_doc
dockeyword=comment_doc_keyword
number=number_1
word=keyword_1
string=string_1
preprocessor=preprocessor
operator=operator
identifier=identifier_1
date=number_2
stringeol=string_eol
word2=keyword_2
word3=keyword_3
word4=keyword_4
constant=identifier_2
asm=type
label=label
error=error
hexnumber=number_1
binnumber=number_1

[keywords]
# Mots-clés "statement" (KEYWORDS, hors symboles d'opérateurs et codes non utilisés #Exx/#FF)
keywords=after auto border call cat chain clear clg closein closeout cls cont data def defint defreal defstr deg delete dim draw drawr edit else end ent env erase error every for gosub goto if ink input key let line list load locate memory merge mid$ mode move mover next new on break sq openin openout origin out paper pen plot plotr poke print rem rad randomize read release renum restore resume return run save sound speed stop symbol tag tagoff troff tron wait wend while width window write zone di ei fill graphics mask frame cursor erl fn spc step swap tab then to using and mod or xor not
# Fonctions (FUNCTIONS, préfixées &FF sur le vrai octet, présentées ici comme mots simples)
word2=abs asc atn chr$ cint cos creal exp fix fre inkey inp int joy len log log10 lower$ peek remain sgn sin space$ sq sqr str$ tan unt upper$ val eof err himem inkey$ pi rnd time xpos ypos derr bin$ dec$ hex$ instr left$ max min pos right$ round string$ test testr copychr$ vpos
# user definable keywords
user1=
user2=

[settings]
# lexer à réutiliser (sans ça, pas de coloration du tout)
lexer_filetype=FreeBasic

# extension par défaut à l'enregistrement
extension=bas

# CPC BASIC n'a qu'un commentaire ligne (REM, ou son raccourci ') - pas de bloc multi-lignes
comment_single='
comment_use_indent=true

context_action_cmd=

[indentation]
#width=2
#type=1
